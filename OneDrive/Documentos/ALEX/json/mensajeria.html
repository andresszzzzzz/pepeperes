<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de Envío</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f2f5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      border-radius: 10px;
      padding: 30px;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #004aad;
      font-weight: 600;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-weight: 500;
      color: #444;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
    }

    .radio-group {
      text-align: left;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .resultado {
      margin-top: 25px;
      background-color: #f9fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    .resultado h2 {
      color: #333;
    }

    .imagen-articulo {
      margin-top: 15px;
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: none;
    }

    .error {
      color: red;
      font-size: 0.9em;
      margin-bottom: 10px;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Calculadora de Envío</h1>

    <label for="peso">Peso del paquete (kg):</label>
    <input type="number" id="peso" placeholder="Ej: 2.5" min="0" step="any">

    <label for="tipo">Tipo de artículo:</label>
    <select id="tipo">
      <option value="">-- Seleccione un tipo --</option>
      <option value="paquete">Paquete (+12%)</option>
      <option value="remesa">Remesa (+25%)</option>
      <option value="sobre">Sobre (+7%)</option>
    </select>

    <div class="radio-group">
      <label><input type="radio" name="seguro" value="no" checked> Sin seguro</label><br>
      <label><input type="radio" name="seguro" value="si"> Con Seguro Todo Riesgo (+6%)</label>
    </div>

    <button onclick="calcularEnvio()">Calcular Costo Total</button>

    <div class="error" id="error"></div>

    <div class="resultado" id="resultado" style="display:none;">
      <h2>Costo Total Final: $<span id="total">0.00</span></h2>
      <img id="imagen" class="imagen-articulo" alt="Imagen artículo">
    </div>
  </div>

  <script>
    function calcularEnvio() {
      const peso = parseFloat(document.getElementById("peso").value);
      const tipo = document.getElementById("tipo").value;
      const radios = document.getElementsByName("seguro");
      const error = document.getElementById("error");
      const resultadoDiv = document.getElementById("resultado");
      const totalSpan = document.getElementById("total");
      const imagen = document.getElementById("imagen");

      error.textContent = "";
      resultadoDiv.style.display = "none";
      imagen.style.display = "none";

      if (isNaN(peso) || peso <= 0) {
        error.textContent = "Por favor, ingrese un peso válido en kg.";
        return;
      }

      if (tipo === "") {
        error.textContent = "Debe seleccionar un tipo de artículo para el envío.";
        return;
      }

      const costoBase = 5600;
      const subtotal = peso * costoBase;

      let recargo = 0;
      switch (tipo) {
        case "paquete": recargo = subtotal * 0.12; 
        case "remesa": recargo = subtotal * 0.25; 
        case "sobre": recargo = subtotal * 0.07;
      }

      let seguroPorcentaje = 0;
      for (let i = 0; i < radios.length; i++) {
        if (radios[i].checked && radios[i].value === "si") {
          seguroPorcentaje = 0.06;
          break;
        }
      }
      const seguro = subtotal * seguroPorcentaje;

      const total = subtotal + recargo + seguro;

      totalSpan.textContent = total.toFixed(2);
      resultadoDiv.style.display = "block";
      imagen.style.display = "block";
    }
  </script>

</body>
</html>
