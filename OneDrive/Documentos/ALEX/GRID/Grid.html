<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outfit Ideas for Men</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>
        <img src="Cityvibes.png" alt="Logo">
        <h1>Outfit Ideas for Men</h1>
    </header>

    <div class="grid-container">
        <div class="outfit">
            <img src="Ropa1.png" alt="Sea Blue + Beige">
            <p>Sea Blue + Beige</p>
        </div>
        <div class="outfit">
            <img src="Ropa2.png" alt="Beige + Navy">
            <p>Beige + Navy</p>
        </div>
        <div class="outfit">
            <img src="Ropa3.png" alt="Olive + Sky Blue">
            <p>Olive + Sky Blue</p>
        </div>
        <div class="outfit">
            <img src="Ropa4.png" alt="Blue + Dark Blue">
            <p>Blue + Dark Blue</p>
        </div>
        <div class="outfit">
            <img src="Ropa5.png" alt="Dark Blue + Grey">
            <p>Dark Blue + Grey</p>
        </div>
        <div class="outfit">
            <img src="Ropa6.png" alt="Olive + Khaki">
            <p>Olive + Khaki</p>
        </div>
        <div class="social-bar">
            <div class="instagram">
                <img src="Instagram.jpg" alt="Instagram">
                <span>/cityvibesindia</span>
            </div>
            <div class="web">
                <img src="internet.png" alt="Web">
                <span>cityvibes.in</span>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
